<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sounds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .sound-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sound-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .sound-card span {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            word-break: break-word;
            min-height: 30px;
        }

        .upload-label {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        .upload-label:hover {
            opacity: 0.9;
        }

        input[type="file"] {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .stop-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stop-btn:hover {
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .global-stop {
            width: 100%;
            padding: 18px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #f5576c 0%, #830133 100%);
            margin-top: 20px;
        }

        .global-stop:hover {
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.6);
        }

        .progress-container {
            margin-top: 10px;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 20px;
            }

            .sounds-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Audio Player</h1>
        
        <div class="sounds-grid">
            <!-- Sound 1 -->
            <div class="sound-card">
                <span id="name-1">Sound 1</span>
                <label class="upload-label" for="file-1">Load Audio</label>
                <input type="file" id="file-1" accept="audio/*" onchange="loadAudio(this, 1)">
                <div class="button-group">
                    <button class="btn" onclick="playAudio(1)">Play</button>
                    <button class="btn stop-btn" onclick="stopAudio(1)">Stop</button>
                </div>
                <div class="progress-container" id="progress-1">
                    <div class="progress-bar">
                        <div class="progress-fill" id="fill-1"></div>
                    </div>
                    <div class="time-display" id="time-1">0:00 / 0:00</div>
                </div>
            </div>

            <!-- Sound 2 -->
            <div class="sound-card">
                <span id="name-2">Sound 2</span>
                <label class="upload-label" for="file-2">Load Audio</label>
                <input type="file" id="file-2" accept="audio/*" onchange="loadAudio(this, 2)">
                <div class="button-group">
                    <button class="btn" onclick="playAudio(2)">Play</button>
                    <button class="btn stop-btn" onclick="stopAudio(2)">Stop</button>
                </div>
                <div class="progress-container" id="progress-2">
                    <div class="progress-bar">
                        <div class="progress-fill" id="fill-2"></div>
                    </div>
                    <div class="time-display" id="time-2">0:00 / 0:00</div>
                </div>
            </div>

            <!-- Sound 3 -->
            <div class="sound-card">
                <span id="name-3">Sound 3</span>
                <label class="upload-label" for="file-3">Load Audio</label>
                <input type="file" id="file-3" accept="audio/*" onchange="loadAudio(this, 3)">
                <div class="button-group">
                    <button class="btn" onclick="playAudio(3)">Play</button>
                    <button class="btn stop-btn" onclick="stopAudio(3)">Stop</button>
                </div>
                <div class="progress-container" id="progress-3">
                    <div class="progress-bar">
                        <div class="progress-fill" id="fill-3"></div>
                    </div>
                    <div class="time-display" id="time-3">0:00 / 0:00</div>
                </div>
            </div>

            <!-- Sound 4 -->
            <div class="sound-card">
                <span id="name-4">Sound 4</span>
                <label class="upload-label" for="file-4">Load Audio</label>
                <input type="file" id="file-4" accept="audio/*" onchange="loadAudio(this, 4)">
                <div class="button-group">
                    <button class="btn" onclick="playAudio(4)">Play</button>
                    <button class="btn stop-btn" onclick="stopAudio(4)">Stop</button>
                </div>
                <div class="progress-container" id="progress-4">
                    <div class="progress-bar">
                        <div class="progress-fill" id="fill-4"></div>
                    </div>
                    <div class="time-display" id="time-4">0:00 / 0:00</div>
                </div>
            </div>
        </div>

        <button class="btn stop-btn global-stop" onclick="stopAll()">⏹ STOP ALL AUDIO</button>
    </div>

    <script>
        // Store audio objects
        const audioTracks = {};
        const progressIntervals = {};

        // Format time in MM:SS
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Update progress bar
        function updateProgress(id) {
            if (audioTracks[id]) {
                const audio = audioTracks[id];
                const percentage = (audio.currentTime / audio.duration) * 100;
                document.getElementById(`fill-${id}`).style.width = percentage + '%';
                document.getElementById(`time-${id}`).innerText = 
                    `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            }
        }

        // Load file from user's computer into the browser memory
        function loadAudio(input, id) {
            const file = input.files[0];
            if (file) {
                // Update display name
                document.getElementById(`name-${id}`).innerText = file.name.split('.')[0];

                // Create local object URL for the audio file
                const fileURL = URL.createObjectURL(file);
                audioTracks[id] = new Audio(fileURL);

                // Show progress container
                document.getElementById(`progress-${id}`).classList.add('active');

                // Update progress when metadata is loaded
                audioTracks[id].addEventListener('loadedmetadata', () => {
                    updateProgress(id);
                });

                // Update progress during playback
                audioTracks[id].addEventListener('timeupdate', () => {
                    updateProgress(id);
                });

                // Handle end of audio
                audioTracks[id].addEventListener('ended', () => {
                    stopAudio(id);
                });
            }
        }

        // Play specific track
        function playAudio(id) {
            if (audioTracks[id]) {
                audioTracks[id].currentTime = 0; // Rewind to start
                audioTracks[id].play();
            } else {
                alert("Please click 'Load Audio' to choose a file first!");
            }
        }

        // Stop specific track
        function stopAudio(id) {
            if (audioTracks[id]) {
                audioTracks[id].pause();
                audioTracks[id].currentTime = 0;
                updateProgress(id);
            }
        }

        // Emergency panic button to silence everything instantly
        function stopAll() {
            Object.keys(audioTracks).forEach(id => {
                audioTracks[id].pause();
                audioTracks[id].currentTime = 0;
                updateProgress(id);
            });
        }
    </script>
</body>
</html>
