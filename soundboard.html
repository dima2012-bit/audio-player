<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .soundboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .sound-button {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: none;
            border-radius: 15px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            min-height: 150px;
            justify-content: center;
            position: relative;
        }

        .sound-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .sound-button:active {
            transform: translateY(-2px);
        }

        .sound-button.playing {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
        }

        .emoji {
            font-size: 2.5em;
        }

        .sound-name {
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upload-container {
            margin-top: 30px;
            border-top: 2px solid #e0e0e0;
            padding-top: 30px;
        }

        .upload-container h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .upload-slot {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: 2px dashed #667eea;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .upload-slot:hover {
            border-color: #764ba2;
            background: linear-gradient(135deg, #e8edf9 0%, #d5c8dc 100%);
        }

        .upload-slot.has-file {
            border-style: solid;
            border-color: #667eea;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8def5 100%);
        }

        .upload-label {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            text-align: center;
            transition: opacity 0.3s ease;
            width: 100%;
        }

        .upload-label:hover {
            opacity: 0.9;
        }

        input[type="file"] {
            display: none;
        }

        .slot-name {
            color: #666;
            font-size: 0.9em;
            font-weight: 600;
        }

        .slot-name.active {
            color: #333;
            font-weight: 700;
        }

        .slot-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
        }

        .slot-play {
            flex: 1;
            padding: 8px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .slot-play:hover {
            transform: scale(1.05);
        }

        .slot-play:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .slot-stop {
            padding: 8px 12px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .slot-stop:hover {
            transform: scale(1.05);
        }

        .global-controls {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.95em;
        }

        .stop-all-btn {
            background: linear-gradient(135deg, #f5576c 0%, #830133 100%);
            color: white;
        }

        .stop-all-btn:hover {
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
            transform: scale(1.02);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 15px 20px;
            border-radius: 10px;
        }

        .volume-control label {
            font-weight: 600;
            color: #333;
        }

        #volumeSlider {
            width: 150px;
            cursor: pointer;
            accent-color: #667eea;
        }

        #volumeValue {
            min-width: 40px;
            text-align: right;
            font-weight: 600;
            color: #333;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .soundboard-grid {
                grid-template-columns: 1fr;
            }

            .upload-grid {
                grid-template-columns: 1fr;
            }

            .global-controls {
                flex-direction: column;
            }

            .control-btn {
                width: 100%;
            }

            .volume-control {
                flex-direction: column;
                align-items: stretch;
            }

            #volumeSlider {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 SOUNDBOARD</h1>
        
        <div class="soundboard-grid">
            <!-- Fart Sound -->
            <button class="sound-button" onclick="playFart()" id="fartBtn">
                <span class="emoji">💨</span>
                <span class="sound-name">Fart</span>
            </button>

            <!-- Test Tone -->
            <button class="sound-button" onclick="playTestTone()" id="testBtn">
                <span class="emoji">🔊</span>
                <span class="sound-name">Test Tone</span>
            </button>
        </div>

        <div class="upload-container">
            <h2>🎶 Custom Sounds</h2>
            <div class="upload-grid">
                <!-- Slot 1 -->
                <div class="upload-slot" id="slot1-container">
                    <label class="upload-label" for="file-1">📁 Upload Sound</label>
                    <input type="file" id="file-1" accept="audio/*" onchange="loadAudio(this, 1)">
                    <div class="slot-name" id="slot1-name">Slot 1</div>
                    <div class="slot-buttons">
                        <button class="slot-play" id="slot1-play" onclick="playSlot(1)" disabled>Play</button>
                        <button class="slot-stop" onclick="stopSlot(1)">Stop</button>
                    </div>
                </div>

                <!-- Slot 2 -->
                <div class="upload-slot" id="slot2-container">
                    <label class="upload-label" for="file-2">📁 Upload Sound</label>
                    <input type="file" id="file-2" accept="audio/*" onchange="loadAudio(this, 2)">
                    <div class="slot-name" id="slot2-name">Slot 2</div>
                    <div class="slot-buttons">
                        <button class="slot-play" id="slot2-play" onclick="playSlot(2)" disabled>Play</button>
                        <button class="slot-stop" onclick="stopSlot(2)">Stop</button>
                    </div>
                </div>

                <!-- Slot 3 -->
                <div class="upload-slot" id="slot3-container">
                    <label class="upload-label" for="file-3">📁 Upload Sound</label>
                    <input type="file" id="file-3" accept="audio/*" onchange="loadAudio(this, 3)">
                    <div class="slot-name" id="slot3-name">Slot 3</div>
                    <div class="slot-buttons">
                        <button class="slot-play" id="slot3-play" onclick="playSlot(3)" disabled>Play</button>
                        <button class="slot-stop" onclick="stopSlot(3)">Stop</button>
                    </div>
                </div>

                <!-- Slot 4 -->
                <div class="upload-slot" id="slot4-container">
                    <label class="upload-label" for="file-4">📁 Upload Sound</label>
                    <input type="file" id="file-4" accept="audio/*" onchange="loadAudio(this, 4)">
                    <div class="slot-name" id="slot4-name">Slot 4</div>
                    <div class="slot-buttons">
                        <button class="slot-play" id="slot4-play" onclick="playSlot(4)" disabled>Play</button>
                        <button class="slot-stop" onclick="stopSlot(4)">Stop</button>
                    </div>
                </div>

                <!-- Slot 5 -->
                <div class="upload-slot" id="slot5-container">
                    <label class="upload-label" for="file-5">📁 Upload Sound</label>
                    <input type="file" id="file-5" accept="audio/*" onchange="loadAudio(this, 5)">
                    <div class="slot-name" id="slot5-name">Slot 5</div>
                    <div class="slot-buttons">
                        <button class="slot-play" id="slot5-play" onclick="playSlot(5)" disabled>Play</button>
                        <button class="slot-stop" onclick="stopSlot(5)">Stop</button>
                    </div>
                </div>

                <!-- Slot 6 -->
                <div class="upload-slot" id="slot6-container">
                    <label class="upload-label" for="file-6">📁 Upload Sound</label>
                    <input type="file" id="file-6" accept="audio/*" onchange="loadAudio(this, 6)">
                    <div class="slot-name" id="slot6-name">Slot 6</div>
                    <div class="slot-buttons">
                        <button class="slot-play" id="slot6-play" onclick="playSlot(6)" disabled>Play</button>
                        <button class="slot-stop" onclick="stopSlot(6)">Stop</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="global-controls">
            <div class="volume-control">
                <label for="volumeSlider">🔊 Volume:</label>
                <input type="range" id="volumeSlider" min="0" max="100" value="100" onchange="updateVolume()">
                <span id="volumeValue">100%</span>
            </div>
            <button class="control-btn stop-all-btn" onclick="stopAll()">⏹️ STOP ALL</button>
        </div>
    </div>

    <script>
        const slots = {};
        let masterVolume = 1;
        let testToneOscillators = [];
        let testToneStartTime = 0;

        // Load sounds from local storage
        function init() {
            loadSounds();
        }

        // Save sounds to local storage
        function saveSounds() {
            const soundData = {};
            for (let id in slots) {
                if (slots[id].fileURL) {
                    soundData[id] = slots[id].name;
                }
            }
            localStorage.setItem('soundboardSounds', JSON.stringify(soundData));
        }

        // Load sounds from local storage
        function loadSounds() {
            const saved = localStorage.getItem('soundboardSounds');
            if (saved) {
                const soundData = JSON.parse(saved);
                // Note: File URLs won't persist, but names do
            }
        }

        // Update volume
        function updateVolume() {
            const slider = document.getElementById('volumeSlider');
            masterVolume = slider.value / 100;
            document.getElementById('volumeValue').textContent = slider.value + '%';
        }

        // Load audio file
        function loadAudio(input, slotId) {
            const file = input.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                const audio = new Audio(fileURL);
                audio.volume = masterVolume;

                slots[slotId] = {
                    audio: audio,
                    fileURL: fileURL,
                    name: file.name.split('.')[0]
                };

                // Update UI
                document.getElementById(`slot${slotId}-name`).textContent = slots[slotId].name;
                document.getElementById(`slot${slotId}-name`).classList.add('active');
                document.getElementById(`slot${slotId}-play`).disabled = false;
                document.getElementById(`slot${slotId}-container`).classList.add('has-file');

                // Handle audio end
                audio.addEventListener('ended', () => {
                    document.getElementById(`slot${slotId}-play`).classList.remove('playing');
                });

                saveSounds();
            }
        }

        // Play sound from slot
        function playSlot(slotId) {
            if (slots[slotId]) {
                const audio = slots[slotId].audio;
                audio.currentTime = 0;
                audio.volume = masterVolume;
                audio.play();
                document.getElementById(`slot${slotId}-play`).classList.add('playing');
            }
        }

        // Stop sound from slot
        function stopSlot(slotId) {
            if (slots[slotId]) {
                slots[slotId].audio.pause();
                slots[slotId].audio.currentTime = 0;
                document.getElementById(`slot${slotId}-play`).classList.remove('playing');
            }
        }

        // Play fart sound
        function playFart() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioContext.currentTime;
            const duration = 0.8;

            const osc1 = audioContext.createOscillator();
            const osc2 = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);

            filter.type = 'highpass';
            filter.frequency.setValueAtTime(200, now);
            filter.frequency.exponentialRampToValueAtTime(50, now + duration);

            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(200, now);
            osc1.frequency.exponentialRampToValueAtTime(100, now + duration);

            osc2.type = 'square';
            osc2.frequency.setValueAtTime(150, now);
            osc2.frequency.exponentialRampToValueAtTime(80, now + duration);

            gainNode.gain.setValueAtTime(1.5 * masterVolume, now);
            gainNode.gain.exponentialRampToValueAtTime(0.1 * masterVolume, now + duration);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + duration);
            osc2.stop(now + duration);

            // Animate button
            document.getElementById('fartBtn').classList.add('playing');
            setTimeout(() => {
                document.getElementById('fartBtn').classList.remove('playing');
            }, duration * 1000);
        }

        // Play test tone
        function playTestTone() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioContext.currentTime;
            const duration = 3;

            testToneStartTime = now;
            testToneOscillators = [];

            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, now);

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.5 * masterVolume, now + 0.1);
            gainNode.gain.linearRampToValueAtTime(0.5 * masterVolume, now + duration - 0.1);
            gainNode.gain.linearRampToValueAtTime(0, now + duration);

            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);

            osc.start(now);
            osc.stop(now + duration);

            testToneOscillators.push(osc);

            // Animate button
            document.getElementById('testBtn').classList.add('playing');
            setTimeout(() => {
                document.getElementById('testBtn').classList.remove('playing');
            }, duration * 1000);
        }

        // Stop all sounds
        function stopAll() {
            for (let slotId in slots) {
                stopSlot(slotId);
            }
            testToneOscillators.forEach(osc => {
                try {
                    osc.stop();
                } catch (e) {}
            });
            testToneOscillators = [];
            document.getElementById('fartBtn').classList.remove('playing');
            document.getElementById('testBtn').classList.remove('playing');
        }

        // Initialize
        window.addEventListener('load', init);
    </script>
</body>
</html>
